server {
    listen 80;
    server_name _;

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        return 404;
    }
}
