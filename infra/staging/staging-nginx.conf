# Staging tek giriş noktası. Callback ve ödeme ekranı AYNI origin'de olmalı:
# PayTR'nin Bildirim URL'si ile merchant_ok_url aynı alan adını kullanır.
server {
    listen 80;
    server_name _;
    # Tünel alan adı önceden bilinmediği için Host başlığı olduğu gibi
    # iletilir; backend ALLOWED_HOSTS'u .env.staging'den okur.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Tünel TLS'i sonlandırır; Django secure-cookie/HTTPS kararını buna göre verir.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ { alias /srv/static/; }
    location /media/  { alias /srv/media/; }

    # SPA — /odeme/<token>, /odeme/basarili, /odeme/basarisiz dahil.
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
