# =============================================================================
#  STAGING — GERÇEK PayTR TEST ÖDEMESİ İÇİN İZOLE ORTAM
#
#  Üretimden TAMAMEN ayrıdır:
#    * ayrı compose projesi (-p ubercekici-staging)
#    * ayrı veritabanı ve redis (ayrı volume'ler — üretim verisine dokunmaz)
#    * `edge` ağına KATILMAZ, paylaşılan Caddy bu servisleri görmez
#    * portlar yalnızca 127.0.0.1'e bağlanır; dışarıya açılış tünelle yapılır
#
#  Çalıştırma (depo kökünden):
#    docker compose -p ubercekici-staging \
#      --env-file infra/staging/.env.staging \
#      -f infra/staging/docker-compose.staging.yml up -d --build
#
#  Kapatma ve TÜM staging verisini silme:
#    docker compose -p ubercekici-staging \
#      -f infra/staging/docker-compose.staging.yml down -v
#
#  Ayrıntılı adımlar: infra/staging/README.md
# =============================================================================

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cekicim_staging}
      POSTGRES_USER: ${POSTGRES_USER:-cekicim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging-pass}
    volumes:
      - staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cekicim} -d ${POSTGRES_DB:-cekicim_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [staging]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - staging_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [staging]

  # DİKKAT: servis/konteyner adlarında ALT ÇİZGİ KULLANMAYIN. Django, HTTP
  # Host başlığındaki alt çizgiyi RFC 1034/1035 gereği geçersiz sayar ve
  # isteği view'e ulaşmadan 400 DisallowedHost ile reddeder.
  backend:
    build:
      context: ../../backend
      args:
        BUILD_ENV: prod
    restart: unless-stopped
    env_file: .env.staging
    environment:
      RUN_MIGRATIONS: "true"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 30 --access-logfile - --error-logfile -
    volumes:
      - staging_static:/app/staticfiles
      - staging_media:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/schema/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [staging]

  frontend:
    build:
      context: ../../frontend
      args:
        # Boş: frontend API adresini tarayıcının origin'inden türetir.
        VITE_API_BASE_URL: ""
        VITE_WS_BASE_URL: ""
    restart: unless-stopped
    networks: [staging]

  # Tek giriş noktası: /api ve /django-admin -> backend, geri kalanı -> SPA.
  # Tünel bu servise bağlanır, böylece callback ve ödeme ekranı AYNI origin'de
  # olur (PayTR'nin dönüş adresleri ve bildirim URL'si aynı alan adını kullanır).
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./staging-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staging_static:/srv/static:ro
      - staging_media:/srv/media:ro
    ports:
      # Yalnızca localhost'a bağlanır — dışarıya açılış cloudflared tüneliyle.
      - "127.0.0.1:${STAGING_PORT:-8096}:80"
    depends_on:
      backend: {condition: service_healthy}
    networks: [staging]

networks:
  staging:
    name: ubercekici-staging-net

volumes:
  staging_postgres:
  staging_redis:
  staging_static:
  staging_media:
